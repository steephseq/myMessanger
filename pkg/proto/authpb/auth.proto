syntax = "proto3";

import "google/api/annotations.proto";

package auth;
option go_package="mess/pkg/proto/authpb;authpb";

service AuthService {
    rpc Login(LoginRequest) returns (LoginResponse){
        option (google.api.http) = {
            post: "/login"
            body: "*"
        };
    };
    rpc Register(RegisterRequest) returns (RegisterResponse){
        option (google.api.http) = {
            post: "/register"
            body: "*"
        };
    };
}

message LoginRequest{
    string email = 1;
    string password = 2;
}

message LoginResponse{
    string token = 1;
    string user_id = 2;
    bool success = 3;
}

message RegisterRequest{
    string email = 1;
    string password = 2;
    string name = 3;
    string username = 4;
}

message RegisterResponse{
    bool success = 1;
}
    